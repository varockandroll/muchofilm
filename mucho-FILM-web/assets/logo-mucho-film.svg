<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580">
  <rect width="800" height="580" fill="#FFFFFF"/>
  <!-- "mucho" en cursiva Didot de alto contraste y tracking cerrado -->
  <g transform="translate(405, 240) skewX(-12) scale(0.92, 1.06)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="Didot-Italic, Didot, 'Bodoni 72', Georgia, serif"
      font-style="italic"
      font-size="225"
      fill="#1D1D1B"
    >mucho</text>
  </g>
  <!-- "FILM" en mayúsculas Didot altas y condensadas con remates finos -->
  <g transform="translate(400, 488) scale(0.88, 1.22)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="Didot, 'Bodoni 72', Georgia, serif"
      font-size="215"
      fill="#1D1D1B"
    >FILM</text>
  </g>
</svg>
