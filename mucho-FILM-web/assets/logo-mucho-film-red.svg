<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580">
  <rect width="800" height="580" fill="#141414"/>
  <!-- "mucho" en cursiva Didot de alto contraste y tracking cerrado en blanco marfil -->
  <g transform="translate(405, 235) skewX(-12) scale(0.92, 1.06)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="Didot-Italic, Didot, 'Bodoni 72', Georgia, serif"
      font-style="italic"
      font-size="225"
      fill="#F5F3EE"
    >mucho</text>
  </g>
  <!-- "FILM" en mayúsculas Didot altas y condensadas con remates finos -->
  <g transform="translate(375, 485) scale(0.88, 1.22)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="Didot, 'Bodoni 72', Georgia, serif"
      font-size="215"
      fill="#F5F3EE"
    >FILM</text>
  </g>
  <!-- Safelight Red Dot / Badge en rojo analógico -->
  <circle cx="585" cy="415" r="24" fill="#FF3344" filter="drop-shadow(0 0 16px rgba(255,51,68,0.7))"/>
</svg>
